<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закупкалар</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header: Закупкалар аталышы жана Search + Plus кнопкасы бирге -->
        <header class="app-header" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
            </div>
            <!-- Search & Add Bar хедерайдын ичине киргизилди -->
            <div class="action-bar" style="margin: 0; padding: 0; background: transparent; border: none;">
                <div class="search-box" style="flex: 1;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Издөө..." oninput="filterData()">
                </div>
                <button class="add-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i></button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content-body">
            <!-- PC Table View -->
            <div class="table-responsive">
                <table class="procurement-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>тендер номер</th>
                            <th>Мекемелер</th>
                            <th>Lot аталышы</th>
                            <th>суммасы</th>
                            <th>ГОПП</th>
                            <th>ГОИК</th>
                            <th>Таблица цен</th>
                            <th>Срок вскрытия</th>
                            <th>Файлдар</th>
                            <th>Оңдоо</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Mobile Cards View -->
            <div id="mobileCardsContainer" class="mobile-cards"></div>
        </div>

        <!-- Жалпы сумма блогу (ГОПП, ГОИК алынып салынды, тек тендер суммасы калды) -->
        <div style="position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 2px solid #2563eb; padding: 10px 15px; font-weight: bold; font-size: 14px; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); z-index: 1000;">
    Жалпы суммасы: <span id="totalTender" style="color: #2563eb;">0 сом</span>
</div>



        <!-- Жаңы закупка кошуу же Өзгөртүү модалкасы -->
    <div id="addModal" class="modal">
        <div class="modal-content" style="max-width: 440px; padding: 20px; border-radius: 20px; background: #ffffff; max-height: 90vh; overflow-y: auto;">
            
            <!-- Модалканын хедера (Жарыя кошуу стилинде) -->
            <div style="margin-bottom: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 id="modalTitle" style="margin: 0; font-size: 18px; font-weight: 700; color: #0f172a;">Жаңы закупка кошуу</h3>
                    <button onclick="closeModal()" style="background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: var(--text-light);"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <p style="margin: 4px 0 0 0; font-size: 12px; color: var(--text-light);">Тендер маалыматтарын толук толтуруңуз</p>
            </div>

            <!-- Прогресс сызыгы же Кадам стили -->
            <div style="width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; margin-bottom: 20px; overflow: hidden;">
                <div style="width: 100%; height: 100%; background: var(--primary); border-radius: 2px;"></div>
            </div>

            <form id="procurementForm" onsubmit="event.preventDefault(); saveProcurementData();">
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">№ Тендер</label>
                    <input type="number" id="tenderNum" placeholder="Мисалы: 2026045" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; outline: none;" required>
                </div>
                
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">Мекеменин аты</label>
                    <input type="text" id="orgName" placeholder="Мекеменин аты" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; outline: none;" required>
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">Наименование закупки</label>
                    <input type="text" id="procName" placeholder="Закупканын аталышы" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; outline: none;" required>
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">Тендердин жалпы суммасы (сом)</label>
                    <input type="number" id="tenderSum" placeholder="Мисалы: 150000" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; outline: none;" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                    <div>
                        <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">ГОПП сумма</label>
                        <input type="number" id="goppSum" placeholder="Мисалы: 4567" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">ГОИК сумма</label>
                        <input type="number" id="goikSum" placeholder="Мисалы: 244" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; outline: none;">
                    </div>
                </div>
                
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">Таблица цен (Прайс файл)</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button type="button" class="btn" onclick="triggerNewItemFileSelect()" style="background: #f8fafc; color: var(--text-dark); padding: 10px 12px; font-size: 12px; border-radius: 10px; border: 1px dashed var(--primary); flex: 1; text-align: left; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-file-arrow-up" style="color: var(--primary); font-size: 15px;"></i> <span id="selectedFileNameText" style="color: var(--text-light);">Файл тандала элек</span>
                        </button>
                        <input type="file" id="newItemFileInput" style="display: none;" onchange="handleNewItemFileSelected(this)">
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-size: 11px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 4px;">Срок вскрытия</label>
                    <input type="date" id="openDate" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; outline: none;" required>
                </div>
                
                <!-- Заманбап кнопкалар (Сүрөттөгүдөй чоң жана кооз) -->
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn" onclick="closeModal()" style="background: #f1f5f9; color: var(--text-dark); padding: 12px; font-size: 13px; border-radius: 12px; flex: 1; font-weight: 600; border: none; cursor: pointer;">Жокко чыгаруу</button>
                    <button type="submit" class="btn" style="background: var(--primary); color: white; padding: 12px; font-size: 13px; border-radius: 12px; flex: 1; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">Сактоо <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i></button>
                </div>
            </form>
        </div>
    </div>


    <!-- ГОПП/ГОИК статусун жана файлын өзгөртүү модалкасы -->
    <div id="statusSumModal" class="modal">
        <div class="modal-content" style="max-width: 320px; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 id="statusModalTitle" style="margin: 0; font-size: 15px;">Статусту өзгөртүү</h3>
                <button onclick="closeStatusSumModal()" style="background: none; border: none; font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="statusSumForm" onsubmit="event.preventDefault(); saveStatusSumData();">
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; color: var(--text-light); display: block; margin-bottom: 6px;">Статус тандоо</label>
                    <div style="display: flex; gap: 8px;">
                        <div class="status-selector">
  <div class="status-selector-compact">
    <button type="button" id="statusBtn_red" onclick="setStatusColor('red')" class="status-btn red">
        <i class="fa-solid fa-circle-xmark"></i>
        <span>Төлөнө элек</span>
    </button>

    <button type="button" id="statusBtn_yellow" onclick="setStatusColor('yellow')" class="status-btn yellow">
        <i class="fa-solid fa-clock"></i>
        <span>Күтүлүүдө</span>
    </button>

    <button type="button" id="statusBtn_green" onclick="setStatusColor('green')" class="status-btn green">
        <i class="fa-solid fa-circle-check"></i>
        <span>Төлөндү</span>
    </button>
</div>

</div>
                         </div>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="font-size: 11px; color: var(--text-light); display: block; margin-bottom: 4px;">Тиркеле турган файл</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button type="button" class="btn" onclick="triggerStatusFileSelect()" style="background: #e2e8f0; color: var(--text-dark); padding: 8px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); flex: 1; text-align: left;">
                            <i class="fa-solid fa-file-arrow-up" style="color: var(--primary); margin-right: 6px;"></i> <span id="statusFileNameText">Файл тандоо</span>
                        </button>
                        <input type="file" id="statusModalFileInput" style="display: none;" onchange="handleStatusFileSelected(this)">
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" class="btn" onclick="closeStatusSumModal()" style="background: #e2e8f0; color: var(--text-dark); padding: 8px 12px; font-size: 12px;">Жокко чыгаруу</button>
                    <button type="submit" class="btn" style="background: var(--primary); color: white; padding: 8px 12px; font-size: 12px;">Сактоо</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Бардык файлдардын тизмеси модалкасы -->
    <div id="filesListModal" class="modal">
        <div class="modal-content" style="max-width: 380px; position: relative;">
            <button onclick="closeFilesModal()" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-light);"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="filesModalTitle" style="margin-top: 0; font-size: 15px; margin-right: 20px;">Файлдар</h3>
            <div id="filesContainer" style="display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- Файлды өчүрүүнү ырастоо модалкасы -->
    <div id="confirmModal" class="modal">
        <div class="modal-content" style="max-width: 300px; text-align: center; padding: 22px;">
            <div style="width: 45px; height: 45px; background: #fee2e2; color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 12px;">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h4 style="margin: 0 0 8px; font-size: 15px; color: var(--text-dark);">Файлды өчүрүү</h4>
            <p style="margin: 0 0 20px; font-size: 12px; color: var(--text-light);">Бул файлды өчүрүүнү чын эле каалайсызбы?</p>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn" onclick="closeConfirmModal()" style="background: #e2e8f0; color: var(--text-dark); flex: 1;">Жокко чыгаруу</button>
                <button type="button" class="btn" id="confirmDeleteYesBtn" style="background: #ef4444; color: white; flex: 1;">Өчүрүү</button>
            </div>
        </div>
    </div>

    <!-- Жүктөлүүдө көрсөтүлүүчү лоадер модалкасы -->
    <div id="loadingModal" class="modal">
        <div class="modal-content" style="max-width: 260px; text-align: center; padding: 25px;">
            <div class="spinner"></div>
            <p id="loadingText" style="margin-top: 15px; font-size: 13px; font-weight: 600; color: var(--text-dark);">Файл жүктөлүүдө...</p>
        </div>
    </div>

    <!-- Жашыруун прайс файл тандоочу -->
    <input type="file" id="priceFileInput" style="display: none;" onchange="handlePriceFileSelected(this)">

    <script type="module" src="script.js"></script>
</body>
</html>
